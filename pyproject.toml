[project]
name = "pdftool"
version = "1.2.1"
description = "CLI tool to convert, compress, and manage PDF, JPG, and DOC/DOCX files"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
    "pdf2image>=1.17",
    "Pillow>=10.0",
    "pikepdf>=8.0",
    "python-docx>=1.1",
    "pdf2docx>=0.5.6",
    "docxcompose>=1.4",
    "pymupdf>=1.23",
    "pymupdf4llm>=0.0.17",
    "mammoth>=1.6",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
]

[project.scripts]
pdftool = "pdftool.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
